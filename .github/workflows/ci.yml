name: CI
on:
  workflow_dispatch:
  push:
    tags-ignore:
      - 'v*'
    branches:
      - '*'
  pull_request:
jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            app/libs/libcore.aar
          key: libcore-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml', 'buildScript/**', 'libcore/**') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: libcore/go.sum
      - name: Setup Android SDK
        if: steps.cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager 'ndk;25.0.8775105'
          ./run lib core
      - name: Upload native Android library
        uses: actions/upload-artifact@v5
        with:
          name: native-libcore
          path: app/libs/libcore.aar
          if-no-files-found: error
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Download native Android library
        uses: actions/download-artifact@v5
        with:
          name: native-libcore
          path: app/libs
      - name: HevTun Status
        run: |
          git submodule status hev-socks5-tunnel > hev_status
          cat buildScript/compile-hevtun.sh | sha1sum >> hev_status
      - name: HevTun Cache
        uses: actions/cache@v5
        with:
          path: |
            app/src/main/jniLibs
          key: hevtun-${{ hashFiles('.github/workflows/*', 'hev_status') }}-ci
      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}-ci
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.1' 'ndk;25.0.8775105'
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          ./run init action gradle
          ./gradlew app:assembleOssDebug
      - name: Upload signed debug APKs
        uses: actions/upload-artifact@v5
        with:
          name: NekoBox-XHTTP-APKs
          path: app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error
